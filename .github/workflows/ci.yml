name: TERRITORY 2.0 - safe build and regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: territory-next-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck entire game
        run: npm run typecheck
      - name: V2 isolated UI and combat checks
        run: npm run test:v2
      - name: Verify free 2D art workshop and agent guardrails
        run: |
          npm run art:workshop:check
          node --check .agents/skills/ref2game/scripts/qa.mjs
          node --check .agents/skills/ref2game/scripts/render.mjs
          node --check .agents/skills/ref2game/scripts/livecheck.mjs
          node --check scripts/prepare-v2-art-workshop.mjs
      - name: Verify extra free Studio Igor development helpers
        run: |
          npm run qa:studio-tools
          bash -n tools/agent-qa/ui-diff-check.sh
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('tools/animation-review/contact_sheet.py').read_text())"
      - name: Verify Studio Igor sprite converter and reference UIKit skill
        run: |
          npm run qa:creative-addons
          node --check tools/3d-to-2d/js/app.js
          for script in tools/3d-to-2d/js/modules/*.js; do node --check "$script"; done
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('.agents/skills/reference-uikit/scripts/audit_bundle.py').read_text())"
      - name: Live staging Edge HTTP smoke (read-only, no credentials)
        run: node scripts/check-v2-edge-health.mjs
      - name: Build against fake offline endpoint only
        env:
          VITE_SUPABASE_URL: https://offline-territory-v2-test.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-ci-value-not-a-real-key
          VITE_V2_STAGING_APPROVED: "no"
        run: npm run build
      - name: Validate isolated deploy and static assets
        run: |
          test ! -f .github/workflows/pages.yml
          test -s dist/v2-preview.html
          node scripts/check-v2-original-art-isolation.mjs --dist
          grep -q 'const base' vite.config.ts
          test ! -d dist/assets/territory
          test ! -d dist/monopoly
          echo "V2 offline demo and app build verified; production deployment disabled."
