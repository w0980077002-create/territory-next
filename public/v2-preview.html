<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#152a3f"/>
  <meta name="description" content="TERRITORY 2.0 — мобильный визуальный прототип по утверждённому образцу от 24.10.2026"/>
  <title>TERRITORY 2.0 — интерактивный предпросмотр</title>
  <style>
    /* This file is copied as-is by Vite's publicDir. The actual UI source,
       theme, and templates are loaded from the isolated V2 React entrypoint
       in index.html, avoiding a second, divergent visual mockup. */
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10233a}
    .v2-preview-host{position:fixed;inset:0;display:grid;place-items:stretch;
      height:100vh;height:100dvh;overflow:hidden}
    .v2-preview-frame{display:block;width:100%;height:100%;border:0;
      background:linear-gradient(#138be1,#c4eaff 50%,#392b30)}
    @media(min-width:650px){.v2-preview-host{max-width:490px;margin-inline:auto;
      box-shadow:0 0 0 1px #d2ad66,0 0 50px #000b}}
  </style>
</head>
<body>
  <main class="v2-preview-host" aria-label="Интерактивная демонстрация TERRITORY 2.0">
    <iframe class="v2-preview-frame" id="v2-preview-frame"
      title="TERRITORY 2.0: бой, экипировка, навыки и спутники"
      src="./" loading="eager" referrerpolicy="same-origin"></iframe>
  </main>
</body>
</html>
